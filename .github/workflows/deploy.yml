name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labquest
          POSTGRES_PASSWORD: labquest
          POSTGRES_DB: labquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run
        env:
          TEST_DATABASE_URL: postgresql://labquest:labquest@localhost:5432/labquest_test

      - name: Build
        run: npm run build

  # O Playwright sobe o backend contra E2E_DATABASE_URL, aplicando migrations e
  # o seed --demo antes de iniciar, e o Vite em :3000 (ver playwright.config.ts).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labquest
          POSTGRES_PASSWORD: labquest
          POSTGRES_DB: labquest_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://labquest:labquest@localhost:5432/labquest_e2e

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # O seed e o servidor importam @prisma/client, que precisa do client gerado.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # O Hostinger faz deploy a cada push na branch `production`. Só este job a
  # avança, e só depois de o schema do Supabase estar migrado. Migrar e liberar
  # ficam no mesmo job: com jobs separados no mesmo grupo de concorrência, o
  # release de um push cancelava o migrate pendente do push seguinte, que nunca subia.
  release:
    name: Migrate Supabase and release
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      DEVELOPER_INITIAL_PASSWORD: ${{ secrets.PROD_DEVELOPER_INITIAL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # O seed regrava a senha da conta developer; sem o secret ele gravaria a senha de dev.
      - name: Check required secrets
        run: |
          for name in DATABASE_URL DIRECT_URL DEVELOPER_INITIAL_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ausente para $name (PROD_$name)"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed developer account
        run: npm run build && node dist/server/db/seed.mjs

      # Só fast-forward: se `production` divergiu da main, o push falha em vez de reescrever histórico.
      # Uma execução pendente mais nova substitui uma mais velha, mas o commit dela contém o da velha.
      - name: Fast-forward production
        run: git push origin HEAD:refs/heads/production
